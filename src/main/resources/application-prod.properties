# Perfil de produccion
app.environment=prod
server.port=9090

# Logging menos verboso en produccion
logging.level.root=WARN
logging.level.org.example.proyecto1=WARN

# Base de datos PostgreSQL en produccion
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventario}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Consola H2 deshabilitada y cookies seguras en produccion
spring.h2.console.enabled=false
server.servlet.session.cookie.secure=true