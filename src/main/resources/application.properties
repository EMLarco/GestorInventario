spring.application.name=gestor-inventario

# ===== Metadata de la aplicacion (AppInfoProperties) =====
app.name=Gestor de Inventario
app.version=@project.version@
app.description=API REST para la gestion de inventario
app.environment=local
app.developer.name=Dev Inventario
app.developer.email=dev@inventario.com

# ===== Servidor =====
server.port=8080
server.error.include-message=always

# ===== Logging =====
logging.level.root=INFO
logging.level.org.example.proyecto1=INFO
logging.file.name=logs/inventario.log
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# ===== Base de datos (H2 en memoria por defecto para local/tests) =====
spring.datasource.url=${DB_URL:jdbc:h2:mem:inventario;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# ===== JSON (Jackson) =====
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
management.endpoint.health.show-details=always

# ===== Seguridad =====
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=15m

# ===== Session JDBC =====
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.table-name=SPRING_SESSION

# ===== i18n =====
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false